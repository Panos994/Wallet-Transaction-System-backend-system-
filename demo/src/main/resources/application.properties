#docker run --name my-postgres-wallettsms -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=my_wallet_transaction_db -p 5452:5432 -d postgres  ---> for running the db container

#2) for entering the DB
#docker exec -it my-postgres-wallettsms psql -U postgres -d my_wallet_transaction_db