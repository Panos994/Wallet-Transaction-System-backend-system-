server.port=9699
spring.application.name=wallet_transaction_system


spring.datasource.url=jdbc:postgresql://localhost:5452/my_wallet_transaction_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.hibernate.ddl-auto = update

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

#jwt token
spring.private.token=my_super_secret_key_123456_extra_characters_for_security

#logs
logging.level.org.springframework.security=DEBUG
logging.level.job_application_system_training_project=DEBUG





